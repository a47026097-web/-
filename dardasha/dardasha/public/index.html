<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دردشة</title>

  <link rel="stylesheet" href="style.css?v=20260915">
</head>

<body>

  <!-- LOGIN / REGISTER -->
  <main id="gate" class="gate">

    <div class="gate__card">

      <h1 class="gate__logo">دردشة</h1>

      <p class="gate__tag">
        رسائل فورية بين أي جهازين على نفس الشبكة
      </p>

      <div class="tabs">
        <button
          class="tab is-active"
          data-mode="login"
          type="button">
          دخول
        </button>

        <button
          class="tab"
          data-mode="register"
          type="button">
          حساب جديد
        </button>
      </div>

      <form id="authForm">

        <label for="username">
          اسم المستخدم
        </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="اسم المستخدم"
          required
        >

        <label for="displayName">
          الاسم الظاهر
        </label>

        <input
          id="displayName"
          name="displayName"
          type="text"
          placeholder="الاسم الظاهر"
        >

        <label for="password">
          كلمة السر
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="كلمة السر"
          required
        >

        <button
          class="primary"
          id="authSubmit"
          type="submit">
          دخول
        </button>

      </form>

      <p id="authError" class="error"></p>

    </div>

  </main>


  <!-- MAIN APP -->
  <div id="app" class="app" hidden>

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <header class="sidebar__header">

        <div>
          <h2>دردشة</h2>
          <p id="myName"></p>
        </div>

        <button
          id="logout"
          type="button">
          خروج
        </button>

      </header>


      <div class="search">

        <input
          id="contactSearch"
          type="text"
          placeholder="ابحث عن شخص"
        >

      </div>


      <div
        id="contacts"
        class="contacts">
      </div>

    </aside>


    <!-- CHAT -->
    <section class="chat">

      <header class="chat__header">

        <button
          id="backToContacts"
          type="button">
          رجوع
        </button>

        <div class="chat__person">

          <div
            id="chatAvatar"
            class="avatar">
          </div>

          <div>

            <h3 id="chatName">
              اختر شخص
            </h3>

            <p id="chatStatus">
              اختر شخص وابدأ الكلام
            </p>

          </div>

        </div>

        <button
          id="callButton"
          type="button"
          aria-label="اتصال">
          📞
        </button>

      </header>


      <div
        id="messages"
        class="messages">
      </div>


      <div
        id="typing"
        class="typing"
        hidden>
        يكتب…
      </div>


      <form
        id="messageForm"
        class="message-form">

        <input
          id="messageInput"
          type="text"
          placeholder="اكتب رسالة..."
          autocomplete="off"
        >

        <button
          type="submit">
          إرسال
        </button>

      </form>

    </section>

  </div>


  <!-- CALL UI -->
  <div
    class="call-layer"
    id="callLayer"
    hidden>

    <div class="call-card">

      <div
        id="callAvatar"
        class="call-avatar">
      </div>

      <h2 id="callName">
        مكالمة
      </h2>

      <p id="callStatus">
        يتصل…
      </p>


      <!-- INCOMING CALL -->
      <div
        class="call-actions"
        id="callActionsIncoming"
        hidden>

        <button
          id="rejectCall"
          type="button">
          رفض
        </button>

        <button
          id="acceptCall"
          type="button">
          قبول
        </button>

      </div>


      <!-- ACTIVE CALL -->
      <div
        class="call-actions"
        id="callActionsActive"
        hidden>

        <button
          id="muteCall"
          type="button">
          كتم
        </button>

        <button
          id="endCall"
          type="button">
          إنهاء
        </button>

      </div>

    </div>

  </div>


  <!-- AUDIO -->
  <audio
    id="remoteAudio"
    autoplay
    playsinline>
  </audio>


  <!-- SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- APP JS - CACHE BUST -->
  <script src="app.js?v=20260915"></script>

</body>
</html>
