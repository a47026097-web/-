<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب ويب - متكامل</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #dadbd4; font-family: Tahoma, sans-serif; }
        .whatsapp-bg { background-color: #efeae2; background-image: url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png"); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 md:p-4 overflow-hidden">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-[#00a884] flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
            <h2 class="text-2xl font-bold text-[#00a884] mb-4">تسجيل الدخول إلى واتساب</h2>
            <input type="text" id="username-input" placeholder="أدخل اسمك الكريم..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:border-[#00a884]">
            <button onclick="login()" class="w-full bg-[#00a884] text-white py-2 rounded-lg font-bold hover:bg-[#008f6f] transition">دخول</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-screen" class="w-full h-full max-w-7xl max-h-[95vh] bg-[#f0f2f5] shadow-2xl flex rounded-none md:rounded-lg overflow-hidden hidden">
        
        <!-- الشريط الجانبي -->
        <div class="w-1/3 bg-white border-r border-gray-200 flex flex-col">
            <div class="bg-[#f0f2f5] p-4 flex justify-between items-center border-b">
                <span id="my-username-display" class="font-bold text-gray-700"></span>
                <div class="flex space-x-3 space-x-reverse">
                    <button onclick="createGroup()" class="text-gray-600 hover:text-[#00a884]" title="إنشاء مجموعة"><i class="fa-solid fa-users-rectangle text-xl"></i></button>
                </div>
            </div>
            
            <!-- شريط البحث -->
            <div class="p-2 bg-white border-b">
                <div class="flex items-center bg-[#f0f2f5] px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-search text-gray-400 ml-2"></i>
                    <input type="text" id="search-input" placeholder="بحث عن محادثة..." oninput="filterChats()" class="w-full bg-transparent text-sm focus:outline-none">
                </div>
            </div>

            <div id="chats-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                <!-- المحادثات والأعضاء -->
            </div>
        </div>

        <!-- نافذة المحادثة -->
        <div class="w-2/3 flex flex-col whatsapp-bg">
            <!-- رأس المحادثة -->
            <div class="bg-[#f0f2f5] p-4 flex justify-between items-center border-b">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <h4 id="current-chat-title" class="font-bold text-gray-800">اختر محادثة لبدء الدردشة</h4>
                        <span id="current-chat-status" class="text-xs text-gray-500"></span>
                    </div>
                </div>
                <div class="flex space-x-4 space-x-reverse">
                    <button onclick="startCall('audio')" class="text-gray-600 hover:text-[#00a884] text-xl" title="مكالمة صوتية"><i class="fa-solid fa-phone"></i></button>
                    <button onclick="startCall('video')" class="text-gray-600 hover:text-[#00a884] text-xl" title="مكالمة فيديو"><i class="fa-solid fa-video"></i></button>
                </div>
            </div>

            <!-- رسائل المحادثة -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- الرسائل -->
            </div>

            <!-- إدخال الرسالة والأزرار الإضافية -->
            <div class="bg-[#f0f2f5] p-3 flex flex-col">
                <div id="typing-indicator" class="text-xs text-[#00a884] h-4 mb-1 px-2 font-semibold hidden">يكتب الآن...</div>
                <div class="flex items-center space-x-3 space-x-reverse">
                    <label class="text-gray-600 hover:text-[#00a884] cursor-pointer text-xl" title="إرسال صورة">
                        <i class="fa-solid fa-image"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="sendImage(event)">
                    </label>

                    <button id="mic-btn" onclick="toggleVoiceRecording()" class="text-gray-600 hover:text-red-600 text-xl transition" title="تسجيل رسالة صوتية">
                        <i class="fa-solid fa-microphone"></i>
                    </button>

                    <input type="text" id="message-input" placeholder="اكتب رسالة..." class="flex-1 bg-white px-4 py-2 rounded-lg border-none focus:outline-none" oninput="notifyTyping()" onkeypress="handleKeyPress(event)">
                    
                    <button onclick="sendMessage()" class="bg-[#00a884] text-white px-4 py-2 rounded-lg hover:bg-[#008f6f]"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة المكالمة -->
    <div id="call-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl text-center w-[500px]">
            <h3 id="call-status-text" class="text-lg font-bold mb-4">جاري الاتصال...</h3>
            <div class="flex justify-center space-x-4 mb-4">
                <video id="localVideo" autoplay muted class="w-48 h-36 bg-black rounded-lg object-cover hidden"></video>
                <video id="remoteVideo" autoplay class="w-48 h-36 bg-black rounded-lg object-cover hidden"></video>
                <audio id="remoteAudio" autoplay></audio>
            </div>
            <div id="call-actions">
                <button onclick="endCall()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700">إنهاء المكالمة</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = "";
        let currentChat = "الدردشة العامة";
        let allMessages = [];
        let usersData = {};
        let groupsList = [];
        let typingTimeout;
        
        let peerConnection;
        let localStream;
        let remoteStream;
        let incomingCallData = null;

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        };

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if(type === 'message') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if(type === 'ring') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) {}
        }

        function login() {
            const input = document.getElementById('username-input').value.trim();
            if(!input) return alert("يرجى إدخال اسم صحيح");
            
            if (window.Notification && Notification.permission !== "granted") {
                Notification.requestPermission();
            }

            socket.emit('verify_user', input);
        }

        socket.on('auth_success', (username) => {
            myUsername = username;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('my-username-display').innerText = username;
            switchChat("الدردشة العامة");
        });

        socket.on('update_users', (data) => { usersData = data; renderChatsList(); });
        socket.on('update_groups', (groups) => { groupsList = groups; renderChatsList(); });

        function renderChatsList(filter = '') {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            
            groupsList.forEach(g => {
                if(g.includes(filter)) {
                    list.innerHTML += `<div onclick="switchChat('${g}')" class="p-3 hover:bg-gray-100 cursor-pointer flex items-center justify-between ${currentChat === g ? 'bg-gray-100' : ''}">
                        <span class="font-bold text-gray-800"><i class="fa-solid fa-users text-[#00a884] ml-2"></i> ${g}</span>
                    </div>`;
                }
            });

            for(let u in usersData) {
                if(u !== myUsername && u.includes(filter)) {
                    list.innerHTML += `<div onclick="switchChat('${u}')" class="p-3 hover:bg-gray-100 cursor-pointer flex items-center justify-between ${currentChat === u ? 'bg-gray-100' : ''}">
                        <span class="font-bold text-gray-800"><i class="fa-solid fa-user text-gray-500 ml-2"></i> ${u}</span>
                        <span class="text-xs text-green-600">${usersData[u].status}</span>
                    </div>`;
                }
            }
        }

        function filterChats() {
            const query = document.getElementById('search-input').value.trim();
            renderChatsList(query);
        }

        function switchChat(chatName) {
            currentChat = chatName;
            document.getElementById('current-chat-title').innerText = chatName;
            document.getElementById('current-chat-status').innerText = usersData[chatName] ? usersData[chatName].status : 'مجموعة عامة';
            renderMessages();
            renderChatsList();
        }

        function createGroup() {
            const gName = prompt("أدخل اسم المجموعة الجديدة:");
            if(gName) socket.emit('create_group', gName);
        }

        function sendMessage() {
            const text = document.getElementById('message-input').value.trim();
            if(!text) return;
            const msgData = { chat: currentChat, username: myUsername, type: 'text', text: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            socket.emit('send_message', msgData);
            document.getElementById('message-input').value = '';
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => {
                const msgData = { chat: currentChat, username: myUsername, type: 'image', content: reader.result, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                socket.emit('send_message', msgData);
            };
        }

        async function toggleVoiceRecording() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const msgData = { chat: currentChat, username: myUsername, type: 'audio', content: reader.result, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
                            socket.emit('send_message', msgData);
                        };
                        stream.getTracks().forEach(t => t.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('text-red-600', 'animate-pulse');
                } catch(e) {
                    alert("تعذر الوصول إلى المايكروفون!");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('text-red-600', 'animate-pulse');
            }
        }

        function handleKeyPress(e) { if(e.key === 'Enter') sendMessage(); }

        function notifyTyping() {
            socket.emit('typing', { chat: currentChat, username: myUsername });
        }

        socket.on('display_typing', (data) => {
            if(data.chat === currentChat && data.username !== myUsername) {
                const indicator = document.getElementById('typing-indicator');
                indicator.innerText = `${data.username} يكتب الآن...`;
                indicator.classList.remove('hidden');
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { indicator.classList.add('hidden'); }, 2000);
            }
        });

        socket.on('load_history', (msgs) => { allMessages = msgs; renderMessages(); });
        socket.on('receive_message', (msg) => { 
            allMessages.push(msg); 
            renderMessages(); 
            
            if(msg.username !== myUsername) {
                playSound('message');
                
                if (window.Notification && Notification.permission === "granted") {
                    let bodyText = msg.type === 'text' ? msg.text : (msg.type === 'image' ? 'أرسل صورة' : 'أرسل تسجيل صوتي');
                    new Notification(`رسالة جديدة من ${msg.username} (${msg.chat})`, {
                        body: bodyText,
                        icon: 'https://cdn-icons-png.flaticon.com/512/733/733585.png'
                    });
                }
            }
        });

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            allMessages.filter(m => m.chat === currentChat).forEach(m => {
                const isMe = m.username === myUsername;
                let contentHtml = '';
                if(m.type === 'audio') {
                    contentHtml = `<audio controls class="w-48 h-10"><source src="${m.content}" type="audio/webm"></audio>`;
                } else if(m.type === 'image') {
                    contentHtml = `<img src="${m.content}" class="max-w-xs rounded-lg cursor-pointer" onclick="window.open(this.src)">`;
                } else {
                    contentHtml = `<div class="text-sm text-gray-800">${m.text}</div>`;
                }

                container.innerHTML += `
                    <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-xs px-4 py-2 rounded-lg shadow ${isMe ? 'bg-[#dcf8c6]' : 'bg-white'}">
                            ${!isMe ? `<div class="text-xs font-bold text-blue-600 mb-1">${m.username}</div>` : ''}
                            ${contentHtml}
                            <div class="flex items-center justify-end space-x-1 space-x-reverse mt-1">
                                <span class="text-[10px] text-gray-500">${m.time}</span>
                                ${isMe ? '<span class="text-[10px] text-blue-500"><i class="fa-solid fa-check-double"></i></span>' : ''}
                            </div>
                        </div>
                    </div>`;
            });
            container.scrollTop = container.scrollHeight;
        }

        // بدء المكالمة الصادرة
        async function startCall(type) {
            if(groupsList.includes(currentChat)) return alert("المكالمات الفردية متاحة مع المستخدمين فقط!");
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('call-status-text').innerText = "جاري الاتصال بـ " + currentChat;
            document.getElementById('call-actions').innerHTML = `<button onclick="endCall()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700">إنهاء المكالمة</button>`;

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
            if(type === 'video') {
                document.getElementById('localVideo').classList.remove('hidden');
                document.getElementById('localVideo').srcObject = localStream;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = event => {
                remoteStream = event.streams[0];
                if(type === 'video') {
                    document.getElementById('remoteVideo').classList.remove('hidden');
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                } else {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                }
            };

            peerConnection.onicecandidate = event => {
                if(event.candidate) socket.emit('ice_candidate', { to: currentChat, candidate: event.candidate });
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call_user', { to: currentChat, from: myUsername, offer: offer, type: type });
        }

        // استقبال المكالمة بأزرار تفاعلية حقيقية (بدون تجميد confirm)
        socket.on('incoming_call', (data) => {
            incomingCallData = data;
            playSound('ring');
            document.getElementById('call-modal').classList.remove('hidden');
            document.getElementById('call-status-text').innerHTML = `مكالمة واردة من <span class="font-bold text-[#00a884]">${data.from}</span>`;
            document.getElementById('call-actions').innerHTML = `
                <div class="flex justify-center space-x-4 space-x-reverse">
                    <button onclick="acceptCall()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-green-700">قبول</button>
                    <button onclick="rejectCall()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700">رفض</button>
                </div>
            `;
        });

        async function acceptCall() {
            const data = incomingCallData;
            if(!data) return;
            
            currentChat = data.from;
            document.getElementById('call-status-text').innerText = "جاري الاتصال مع " + data.from;
            document.getElementById('call-actions').innerHTML = `<button onclick="endCall()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-700">إنهاء المكالمة</button>`;

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.type === 'video' });
            if(data.type === 'video') {
                document.getElementById('localVideo').classList.remove('hidden');
                document.getElementById('localVideo').srcObject = localStream;
            }

            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = event => {
                remoteStream = event.streams[0];
                if(data.type === 'video') {
                    document.getElementById('remoteVideo').classList.remove('hidden');
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                } else {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                }
            };

            peerConnection.onicecandidate = event => {
                if(event.candidate) socket.emit('ice_candidate', { to: data.from, candidate: event.candidate });
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('make_answer', { to: data.from, answer: answer, from: myUsername });
        }

        function rejectCall() {
            endCall();
        }

        socket.on('call_answered', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById('call-status-text').innerText = "المكالمة جارية...";
        });

        socket.on('ice_candidate', async (data) => {
            if(peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
            }
        });

        function endCall() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            if(peerConnection) peerConnection.close();
            document.getElementById('call-modal').classList.add('hidden');
            document.getElementById('localVideo').classList.add('hidden');
            document.getElementById('remoteVideo').classList.add('hidden');
            incomingCallData = null;
        }
    </script>
</body>
</html>
