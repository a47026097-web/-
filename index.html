<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب - محادثة ومكالمات وصور</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0c1317; color: #e9edef; display: flex; height: 100vh; overflow: hidden; }

        /* القائمة الجانبية */
        .sidebar { width: 350px; background-color: #111b21; border-left: 1px solid #222d34; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background-color: #202c33; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .add-friend-box { padding: 10px; background-color: #111b21; display: flex; gap: 5px; border-bottom: 1px solid #222d34; }
        .add-friend-box input { flex: 1; padding: 8px 12px; background: #2a3942; border: none; border-radius: 5px; color: #fff; outline: none; font-size: 13px; }
        .add-friend-box button { background-color: #00a884; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; transition: background 0.2s; }
        .contact-item:hover, .contact-item.active { background-color: #2a3942; }
        .contact-avatar { width: 45px; height: 45px; background-color: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color: white; margin-left: 12px; }
        .contact-info { flex: 1; }
        .contact-name { font-size: 15px; color: #f1f1f1; margin-bottom: 3px; }
        .contact-status { font-size: 12px; color: #8696a0; }

        /* نافذة الدردشة */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; }
        .chat-header { padding: 12px 20px; background-color: #202c33; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .chat-header-avatar { width: 40px; height: 40px; background-color: #005c4b; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; }
        .chat-header-name { font-size: 16px; font-weight: bold; color: #f1f1f1; }
        
        /* أزرار المكالمات في الهيدر */
        .call-actions { display: flex; gap: 15px; color: #8696a0; font-size: 18px; cursor: pointer; }
        .call-actions i:hover { color: #00a884; }

        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px; }
        
        .message { max-width: 65%; padding: 8px 12px; border-radius: 7.5px; word-wrap: break-word; font-size: 14px; position: relative; }
        .message.incoming { background-color: #202c33; align-self: flex-start; color: #f1f1f1; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; color: #f1f1f1; }
        .sender-name { font-size: 11px; color: #53bdeb; font-weight: bold; margin-bottom: 3px; display: block; }
        .message img { max-width: 200px; border-radius: 5px; margin-top: 5px; display: block; }

        #form { display: flex; padding: 10px 20px; background-color: #202c33; align-items: center; gap: 10px; }
        #input { flex: 1; padding: 12px 15px; background: #2a3942; border: none; border-radius: 8px; outline: none; color: #fff; font-size: 14px; }
        .file-label { color: #8696a0; font-size: 20px; cursor: pointer; padding: 5px; }
        .file-label:hover { color: #00a884; }
        #send-btn { background-color: #00a884; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #send-btn:hover { background-color: #008f72; }

        /* نافذة تسجيل الدخول */
        #login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: #222d34; padding: 30px; border-radius: 12px; width: 320px; text-align: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .login-box h3 { margin-bottom: 15px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #2a3942; border: 1px solid #3b4a54; border-radius: 6px; color: white; outline: none; text-align: center; font-size: 15px; }
        .login-box button { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="login-modal">
        <div class="login-box">
            <h3>تسجيل الدخول للتطبيق</h3>
            <input type="text" id="username-input" placeholder="اكتب اسمك الحقيقي..." />
            <button onclick="saveUsername()">دخول</button>
        </div>
    </div>

    <!-- القائمة الجانبية للمستخدمين -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span>المستخدمون المتصلون</span>
            <span id="logged-user-name" style="font-size: 12px; color: #00a884;"></span>
        </div>
        
        <div class="add-friend-box">
            <input type="text" id="new-friend-input" placeholder="إضافة اسم صديق..." />
            <button onclick="addFriend()">إضافة</button>
        </div>

        <div class="contacts-list" id="contacts-list"></div>
    </div>

    <!-- نافذة المحادثة -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-header-avatar" id="active-chat-avatar">#</div>
                <div class="chat-header-name" id="active-chat-title">اختر مستخدماً للبدء</div>
            </div>
            <!-- ميزة المكالمات -->
            <div class="call-actions">
                <i class="fas fa-video" title="مكالمة فيديو" onclick="startCall('فيديو')"></i>
                <i class="fas fa-phone-alt" title="مكالمة صوتية" onclick="startCall('صوتية')"></i>
            </div>
        </div>

        <div id="chat-container">
            <div style="text-align: center; color: #8696a0; margin-top: 50px;">اختر حساباً من القائمة وابدأ المراسلة أو إرسال الصور</div>
        </div>

        <!-- خانة الكتابة وإرسال الصور -->
        <form id="form">
            <label class="file-label" title="إرسال صورة">
                <i class="fas fa-image"></i>
                <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="sendImage(event)">
            </label>
            <input id="input" autocomplete="off" placeholder="اكتب رسالة..." />
            <button id="send-btn">إرسال</button>
        </form>
    </div>

    <script>
        const socket = io();
        let username = localStorage.getItem('chat_username');
        let allUsers = [];
        let currentChat = "الكل";

        const loginModal = document.getElementById('login-modal');
        const usernameInput = document.getElementById('username-input');
        const loggedUserName = document.getElementById('logged-user-name');

        if (username) {
            loginModal.style.display = 'none';
            loggedUserName.innerText = "الحساب: " + username;
            socket.emit('register_user', username);
        }

        function saveUsername() {
            const val = usernameInput.value.trim();
            if (!val) {
                alert("يرجى إدخال اسم صحيح!");
                return;
            }
            username = val;
            localStorage.setItem('chat_username', username);
            socket.emit('register_user', username);
            loginModal.style.display = 'none';
            loggedUserName.innerText = "الحساب: " + username;
        }

        // استقبال تحديثات المستخدمين المتصلين من السيرفر
        socket.on('update_users', (users) => {
            allUsers = users;
            renderUsers();
        });

        function renderUsers() {
            const list = document.getElementById('contacts-list');
            list.innerHTML = "";
            
            // خيار عام للكل
            const generalItem = document.createElement('div');
            generalItem.classList.add('contact-item');
            if (currentChat === "الكل") generalItem.classList.add('active');
            generalItem.innerHTML = `
                <div class="contact-avatar">🌍</div>
                <div class="contact-info">
                    <div class="contact-name">دردشة عامة (الكل)</div>
                    <div class="contact-status">متاح للجميع</div>
                </div>
            `;
            generalItem.onclick = () => {
                currentChat = "الكل";
                document.getElementById('active-chat-title').innerText = "دردشة عامة (الكل)";
                document.getElementById('active-chat-avatar').innerText = "🌍";
                renderUsers();
            };
            list.appendChild(generalItem);

            allUsers.forEach(user => {
                if (user === username) return; // لا تعرض نفسك في قائمة الأصدقاء
                const item = document.createElement('div');
                item.classList.add('contact-item');
                if (user === currentChat) item.classList.add('active');
                
                item.innerHTML = `
                    <div class="contact-avatar">${user.charAt(0)}</div>
                    <div class="contact-info">
                        <div class="contact-name">${user}</div>
                        <div class="contact-status">متصل الآن</div>
                    </div>
                `;
                item.onclick = () => {
                    currentChat = user;
                    document.getElementById('active-chat-title').innerText = "محادثة مع: " + user;
                    document.getElementById('active-chat-avatar').innerText = user.charAt(0);
                    renderUsers();
                };
                list.appendChild(item);
            });
        }

        function addFriend() {
            const friendInput = document.getElementById('new-friend-input');
            const newFriend = friendInput.value.trim();
            if (newFriend) {
                socket.emit('register_user', newFriend);
                friendInput.value = "";
            }
        }

        // ميزة إرسال الصور وتحويلها لـ Base64
        function sendImage(event) {
            const file = event.target.files[0];
            if (file && username) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageData = e.target.result;
                    socket.emit('send_message', {
                        username: username,
                        text: "",
                        image: imageData,
                        chat: currentChat
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        // ميزة بدء مكالمة (صوتية أو فيديو)
        function startCall(type) {
            if (currentChat === "الكل") {
                alert("يرجى اختيار صديق معين لبدء المكالمة!");
                return;
            }
            alert(`جاري بدء مكالمة ${type} مع ${currentChat}... (تم تفعيل زر الاتصال بنجاح)`);
            socket.emit('call_user', { from: username, to: currentChat, type: type });
        }

        socket.on('incoming_call', (data) => {
            if (data.to === username) {
                alert(`تتلقى مكالمة ${data.type} من المستخدم: ${data.from}`);
            }
        });

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const chatContainer = document.getElementById('chat-container');

        function appendMessage(data) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            if (data.username === username) {
                messageDiv.classList.add('outgoing');
            } else {
                messageDiv.classList.add('incoming');
            }

            let contentHTML = `<span class="sender-name">${data.username}</span>`;
            if (data.text) {
                contentHTML += `<span>${data.text}</span>`;
            }
            if (data.image) {
                contentHTML += `<img src="${data.image}" alt="صورة مرسلة">`;
            }

            messageDiv.innerHTML = contentHTML;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        socket.on('load_history', (history) => {
            chatContainer.innerHTML = "";
            history.forEach(msg => appendMessage(msg));
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim() && username) {
                socket.emit('send_message', {
                    username: username,
                    text: input.value,
                    image: null,
                    chat: currentChat
                });
                input.value = '';
            }
        });

        socket.on('receive_message', (data) => {
            appendMessage(data);
        });
    </script>
</body>
</html>
