<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>دردشة - محمد حسنين</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #d9dbd5;
}

.chat-bg {
    background-color: #efeae2;
    background-image:
        radial-gradient(#d7d0c6 1px, transparent 1px);
    background-size: 25px 25px;
}

#ai-messages {
    background-color: #efeae2;
    background-image:
        radial-gradient(#d7d0c6 1px, transparent 1px);
    background-size: 25px 25px;
}

.message-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    white-space: pre-wrap;
    word-break: break-word;
}

.user-bubble {
    background: #d9fdd3;
    margin-right: auto;
}

.ai-bubble {
    background: white;
    margin-left: auto;
}

@media(max-width:700px) {

    #sidebar {
        width: 100%;
    }

    #chat-panel {
        display: none;
        width: 100%;
    }

    body.chat-open #sidebar {
        display: none;
    }

    body.chat-open #chat-panel {
        display: flex;
    }

}

</style>

</head>

<body>


<!-- ================================================= -->
<!-- LOGIN -->
<!-- ================================================= -->

<div id="login-screen"
     class="fixed inset-0 bg-[#00a884]
            flex items-center justify-center z-50">

    <div class="bg-white rounded-2xl shadow-2xl
                p-8 w-[380px] text-center">

        <div class="w-20 h-20 mx-auto
                    bg-[#00a884] text-white
                    rounded-full flex items-center
                    justify-center text-4xl">

            <i class="fa-solid fa-comments"></i>

        </div>

        <h1 class="text-2xl font-bold mt-4">
            دردشة
        </h1>

        <p class="text-gray-500 mt-2">
            أهلاً بك في دردشة محمد حسنين
        </p>

        <input
            id="username-input"
            maxlength="30"
            placeholder="اكتب اسمك"
            class="w-full border rounded-xl
                   px-4 py-3 mt-6 outline-none">

        <button
            onclick="login()"
            class="w-full bg-[#00a884]
                   text-white py-3 rounded-xl
                   mt-3 font-bold">

            دخول

        </button>

        <div id="login-error"
             class="text-red-500 text-sm mt-3">
        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- APP -->
<!-- ================================================= -->

<div id="app"
     class="hidden h-screen bg-white">


    <!-- SIDEBAR -->

    <aside id="sidebar"
           class="w-[360px] border-l
                  border-gray-200
                  flex flex-col bg-white">


        <div class="p-3 bg-[#f0f2f5]
                    flex items-center
                    justify-between">

            <div>

                <div id="my-name"
                     class="font-bold">
                </div>

                <div class="text-xs text-green-600">
                    متصل
                </div>

            </div>


            <div class="flex gap-3">

                <!-- AI BUTTON -->

                <button
                    onclick="openAI()"
                    title="الذكاء الاصطناعي"
                    class="w-10 h-10 rounded-full
                           bg-purple-600 text-white
                           hover:bg-purple-700">

                    <i class="fa-solid fa-robot"></i>

                </button>


                <button
                    onclick="createGroup()"
                    class="text-gray-600 text-xl">

                    <i class="fa-solid fa-users"></i>

                </button>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="p-2">

            <input
                id="search"
                oninput="searchChats()"
                placeholder="بحث..."
                class="w-full bg-[#f0f2f5]
                       rounded-lg px-4 py-2
                       outline-none">

        </div>


        <div id="chats-list"
             class="flex-1 overflow-y-auto">
        </div>

    </aside>


    <!-- CHAT -->

    <main id="chat-panel"
          class="flex-1 flex flex-col chat-bg">


        <header class="bg-[#f0f2f5]
                       p-3 flex items-center
                       justify-between">

            <div>

                <div id="chat-title"
                     class="font-bold">
                    الدردشة العامة
                </div>

                <div id="chat-status"
                     class="text-xs text-gray-500">
                    مجموعة
                </div>

            </div>


            <div class="flex gap-5">

                <button
                    onclick="startCall('audio')"
                    class="text-xl">

                    <i class="fa-solid fa-phone"></i>

                </button>

                <button
                    onclick="startCall('video')"
                    class="text-xl">

                    <i class="fa-solid fa-video"></i>

                </button>

            </div>

        </header>


        <div id="messages"
             class="flex-1 overflow-y-auto p-4">
        </div>


        <div id="typing"
             class="hidden text-xs
                    text-[#00a884] px-4">
        </div>


        <footer class="p-3 bg-[#f0f2f5]">

            <div class="flex gap-2">

                <input
                    id="message-input"
                    onkeydown="messageKey(event)"
                    placeholder="اكتب رسالة..."
                    class="flex-1 rounded-xl
                           px-4 py-3 outline-none">

                <button
                    onclick="sendMessage()"
                    class="w-12 h-12
                           bg-[#00a884]
                           text-white rounded-full">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </footer>

    </main>

</div>


<!-- ================================================= -->
<!-- AI WINDOW -->
<!-- ================================================= -->

<div id="ai-screen"
     class="hidden fixed inset-0 z-40 bg-white">


    <!-- AI HEADER -->

    <header class="h-[65px]
                   bg-purple-600
                   text-white px-4
                   flex items-center
                   justify-between">

        <div class="flex items-center gap-3">

            <button
                onclick="closeAI()"
                class="text-xl">

                <i class="fa-solid fa-arrow-right"></i>

            </button>

            <div class="w-10 h-10
                        rounded-full bg-white
                        text-purple-600
                        flex items-center
                        justify-center">

                <i class="fa-solid fa-robot"></i>

            </div>

            <div>

                <div class="font-bold">
                    الذكاء الاصطناعي
                </div>

                <div id="ai-status"
                     class="text-xs opacity-80">

                    جاهز

                </div>

            </div>

        </div>


        <button
            onclick="clearAI()"
            title="مسح المحادثة">

            <i class="fa-solid fa-trash"></i>

        </button>

    </header>


    <!-- AI MESSAGES -->

    <main id="ai-messages"
          class="flex-1 overflow-y-auto p-4">

        <div class="message-bubble ai-bubble">
            🤖 أهلاً! أنا مساعد الذكاء الاصطناعي.
            اكتب لي أي شيء تريد مساعدتي به.
        </div>

    </main>


    <!-- AI INPUT -->

    <footer class="p-3 bg-[#f0f2f5]">

        <div class="flex gap-2">

            <input
                id="ai-input"
                onkeydown="aiKey(event)"
                placeholder="اكتب للذكاء الاصطناعي..."
                class="flex-1 bg-white
                       rounded-xl px-4 py-3
                       outline-none">

            <button
                onclick="sendAI()"
                class="w-12 h-12
                       rounded-full
                       bg-purple-600
                       text-white">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </footer>

</div>


<!-- ================================================= -->
<!-- CALL -->
<!-- ================================================= -->

<div id="call-modal"
     class="hidden fixed inset-0 z-50
            bg-black text-white">

    <div class="h-full flex flex-col">

        <div class="p-4 flex
                    justify-between">

            <div>

                <div id="call-title"
                     class="font-bold text-xl">
                    المكالمة
                </div>

                <div id="call-status"
                     class="text-sm text-gray-300">
                </div>

            </div>

            <button
                onclick="endCall()"
                class="bg-red-600
                       w-12 h-12
                       rounded-full">

                <i class="fa-solid fa-phone-slash"></i>

            </button>

        </div>


        <div class="flex-1
                    flex items-center
                    justify-center">

            <video
                id="remote-video"
                autoplay
                playsinline
                class="hidden w-[80%]
                       max-h-[70%]
                       bg-black rounded-xl">
            </video>

            <video
                id="local-video"
                autoplay
                muted
                playsinline
                class="hidden fixed
                       bottom-28 right-5
                       w-40 h-28
                       bg-black rounded-xl">
            </video>

        </div>


        <div class="p-6 flex
                    justify-center gap-4">

            <button
                onclick="toggleMic()"
                class="w-14 h-14
                       bg-gray-700
                       rounded-full">

                <i class="fa-solid fa-microphone"></i>

            </button>

            <button
                onclick="toggleCamera()"
                class="w-14 h-14
                       bg-gray-700
                       rounded-full">

                <i class="fa-solid fa-video"></i>

            </button>

            <button
                onclick="endCall()"
                class="w-14 h-14
                       bg-red-600
                       rounded-full">

                <i class="fa-solid fa-phone-slash"></i>

            </button>

        </div>

    </div>

</div>


<!-- SOCKET -->

<script src="/socket.io/socket.io.js"></script>


<script>

const socket = io();

let myUsername = "";

let currentChat =
    "الدردشة العامة";

let allMessages = [];

let usersData = {};

let groupsList = [];

let aiHistory = [];

let peerConnection = null;

let localStream = null;

let muted = false;

let cameraOn = true;


/* ================================================
LOGIN
================================================ */

function login() {

    const input =
        document.getElementById(
            "username-input"
        );

    const username =
        input.value.trim();

    if (!username)
        return;

    socket.emit(
        "verify_user",
        username
    );

}


document
    .getElementById(
        "username-input"
    )
    .addEventListener(
        "keydown",
        e => {

            if (e.key === "Enter")
                login();

        }
    );


socket.on(
    "auth_success",
    username => {

        myUsername =
            username;

        document
            .getElementById(
                "login-screen"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "app"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "my-name"
            )
            .innerText =
            username;

        switchChat(
            "الدردشة العامة"
        );

    }
);


socket.on(
    "auth_error",
    message => {

        document
            .getElementById(
                "login-error"
            )
            .innerText =
            message;

    }
);


/* ================================================
USERS
================================================ */

socket.on(
    "update_users",
    users => {

        usersData =
            users;

        renderChats();

    }
);


socket.on(
    "update_groups",
    groups => {

        groupsList =
            groups;

        renderChats();

    }
);


/* ================================================
CHAT LIST
================================================ */

function renderChats(
    filter = ""
) {

    const list =
        document.getElementById(
            "chats-list"
        );

    list.innerHTML = "";


    groupsList.forEach(
        group => {

            const name =
                typeof group === "string"
                    ? group
                    : group.name;

            if (
                filter &&
                !name.includes(filter)
            )
                return;


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "p-4 border-b cursor-pointer hover:bg-gray-100";


            div.innerHTML = `

                <div class="font-bold">
                    👥 ${escapeHtml(name)}
                </div>

                <div class="text-xs text-gray-500">
                    مجموعة
                </div>

            `;


            div.onclick =
                () => switchChat(name);


            list.appendChild(div);

        }
    );


    for (
        const username in usersData
    ) {

        if (
            username ===
            myUsername
        )
            continue;


        if (
            filter &&
            !username.includes(filter)
        )
            continue;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "p-4 border-b cursor-pointer hover:bg-gray-100";


        div.innerHTML = `

            <div class="font-bold">
                👤 ${escapeHtml(username)}
            </div>

            <div class="text-xs ${
                usersData[username].status ===
                "متصل"
                ? "text-green-600"
                : "text-gray-500"
            }">

                ${
                    usersData[username].status ||
                    "غير متصل"
                }

            </div>

        `;


        div.onclick =
            () => switchChat(username);


        list.appendChild(div);

    }

}


function searchChats() {

    renderChats(
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
    );

}


/* ================================================
SWITCH CHAT
================================================ */

function switchChat(name) {

    currentChat =
        name;

    document
        .getElementById(
            "chat-title"
        )
        .innerText =
        name;


    document
        .getElementById(
            "chat-status"
        )
        .innerText =
        usersData[name]
            ? usersData[name].status
            : "مجموعة";


    renderMessages();

}


/* ================================================
MESSAGES
================================================ */

function sendMessage() {

    const input =
        document.getElementById(
            "message-input"
        );

    const text =
        input.value.trim();

    if (!text)
        return;


    socket.emit(
        "send_message",
        {
            chat:
                currentChat,

            type:
                "text",

            text:
                text
        }
    );


    input.value = "";

}


function messageKey(e) {

    if (e.key === "Enter") {

        e.preventDefault();

        sendMessage();

    }

}


socket.on(
    "load_history",
    messages => {

        allMessages =
            messages || [];

        renderMessages();

    }
);


socket.on(
    "receive_message",
    message => {

        allMessages.push(
            message
        );

        renderMessages();

    }
);


function renderMessages() {

    const box =
        document.getElementById(
            "messages"
        );

    box.innerHTML = "";


    allMessages
        .filter(
            m =>
                m.chat ===
                currentChat
        )
        .forEach(
            m => {

                const div =
                    document.createElement(
                        "div"
                    );


                const mine =
                    m.username ===
                    myUsername;


                div.className =
                    mine
                    ? "flex justify-start mb-2"
                    : "flex justify-end mb-2";


                let content =
                    escapeHtml(
                        m.text || ""
                    );


                if (
                    m.type ===
                    "image"
                ) {

                    content =
                        `<img src="${m.content}"
                               class="max-w-[250px] rounded-lg">`;

                }


                if (
                    m.type ===
                    "audio"
                ) {

                    content =
                        `<audio controls
                                src="${m.content}">
                         </audio>`;

                }


                if (
                    m.type ===
                    "file"
                ) {

                    content =
                        `<a href="${m.content}"
                            download="${escapeHtml(m.fileName || "file")}"
                            class="text-blue-600 underline">

                            📎 ${escapeHtml(m.fileName || "ملف")}

                         </a>`;

                }


                div.innerHTML = `

                    <div class="max-w-[75%]
                                px-3 py-2
                                rounded-xl
                                ${
                                    mine
                                    ? "bg-[#d9fdd3]"
                                    : "bg-white"
                                }">

                        ${
                            !mine
                            ? `
                            <div class="text-xs
                                        text-[#00a884]
                                        font-bold">

                                ${escapeHtml(m.username)}

                            </div>
                            `
                            : ""
                        }

                        ${content}

                        <div class="text-[10px]
                                    text-gray-500
                                    mt-1">

                            ${m.time || ""}

                            ${
                                mine
                                ? " ✓✓"
                                : ""
                            }

                        </div>

                    </div>

                `;


                box.appendChild(
                    div
                );

            }
        );


    box.scrollTop =
        box.scrollHeight;

}


/* ================================================
GROUP
================================================ */

function createGroup() {

    const name =
        prompt(
            "اسم المجموعة:"
        );

    if (!name)
        return;


    socket.emit(
        "create_group",
        {
            name:
                name.trim()
        }
    );

}


/* ================================================
AI OPEN
================================================ */

function openAI() {

    document
        .getElementById(
            "ai-screen"
        )
        .classList.remove(
            "hidden"
        );

    document
        .getElementById(
            "ai-input"
        )
        .focus();

}


/* ================================================
AI CLOSE
================================================ */

function closeAI() {

    document
        .getElementById(
            "ai-screen"
        )
        .classList.add(
            "hidden"
        );

}


/* ================================================
AI SEND
================================================ */

function sendAI() {

    const input =
        document.getElementById(
            "ai-input"
        );

    const text =
        input.value.trim();

    if (!text)
        return;


    addAIMessage(
        "user",
        text
    );


    aiHistory.push({

        role:
            "user",

        content:
            text

    });


    document
        .getElementById(
            "ai-status"
        )
        .innerText =
        "جاري التفكير...";


    socket.emit(
        "ai_message",
        {

            text:
                text,

            history:
                aiHistory

        }
    );


    input.value = "";

}


function aiKey(e) {

    if (e.key === "Enter") {

        e.preventDefault();

        sendAI();

    }

}


/* ================================================
AI RESPONSE
================================================ */

socket.on(
    "ai_response",
    data => {

        addAIMessage(
            "assistant",
            data.text
        );


        aiHistory.push({

            role:
                "assistant",

            content:
                data.text

        });


        document
            .getElementById(
                "ai-status"
            )
            .innerText =
            "جاهز";

    }
);


socket.on(
    "ai_status",
    status => {

        document
            .getElementById(
                "ai-status"
            )
            .innerText =
            status;

    }
);


socket.on(
    "ai_error",
    error => {

        addAIMessage(
            "assistant",
            "⚠️ " + error
        );


        document
            .getElementById(
                "ai-status"
            )
            .innerText =
            "حدث خطأ";

    }
);


/* ================================================
AI MESSAGE UI
================================================ */

function addAIMessage(
    role,
    text
) {

    const box =
        document.getElementById(
            "ai-messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        role === "user"
        ? "message-bubble user-bubble"
        : "message-bubble ai-bubble";


    div.innerText =
        text;


    box.appendChild(
        div
    );


    box.scrollTop =
        box.scrollHeight;

}


/* ================================================
CLEAR AI
================================================ */

function clearAI() {

    aiHistory = [];


    const box =
        document.getElementById(
            "ai-messages"
        );


    box.innerHTML = `

        <div class="message-bubble ai-bubble">

            🤖 تم مسح المحادثة.
            اكتب لي من جديد!

        </div>

    `;

}


/* ================================================
CALL
================================================ */

async function startCall(type) {

    if (
        !usersData[currentChat]
    ) {

        alert(
            "اختار مستخدم متصل أولاً."
        );

        return;

    }


    try {

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio: true,

                    video:
                        type === "video"

                });

    } catch (e) {

        alert(
            "تعذر الوصول إلى المايك أو الكاميرا."
        );

        return;

    }


    document
        .getElementById(
            "call-modal"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "call-title"
        )
        .innerText =
        "مكالمة مع " +
        currentChat;


    document
        .getElementById(
            "call-status"
        )
        .innerText =
        "جاري الاتصال...";


    if (
        type ===
        "video"
    ) {

        const video =
            document.getElementById(
                "local-video"
            );

        video.classList.remove(
            "hidden"
        );

        video.srcObject =
            localStream;

    }


    peerConnection =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        });


    localStream
        .getTracks()
        .forEach(
            track =>
                peerConnection.addTrack(
                    track,
                    localStream
                )
        );


    peerConnection.ontrack =
        event => {

            const video =
                document.getElementById(
                    "remote-video"
                );

            video.classList.remove(
                "hidden"
            );

            video.srcObject =
                event.streams[0];

        };


    peerConnection.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                socket.emit(
                    "ice_candidate",
                    {

                        to:
                            currentChat,

                        candidate:
                            event.candidate

                    }
                );

            }

        };


    const offer =
        await peerConnection
            .createOffer();


    await peerConnection
        .setLocalDescription(
            offer
        );


    socket.emit(
        "call_user",
        {

            to:
                currentChat,

            offer:
                offer,

            type:
                type

        }
    );

}


socket.on(
    "incoming_call",
    async data => {

        const accepted =
            confirm(
                "مكالمة واردة من " +
                data.from +
                "\n\nاضغط OK للقبول."
            );


        if (!accepted)
            return;


        try {

            localStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio: true,

                        video:
                            data.type ===
                            "video"

                    });


            document
                .getElementById(
                    "call-modal"
                )
                .classList.remove(
                    "hidden"
                );


            if (
                data.type ===
                "video"
            ) {

                const video =
                    document.getElementById(
                        "local-video"
                    );

                video.classList.remove(
                    "hidden"
                );

                video.srcObject =
                    localStream;

            }


            peerConnection =
                new RTCPeerConnection({

                    iceServers: [

                        {
                            urls:
                            "stun:stun.l.google.com:19302"
                        }

                    ]

                });


            localStream
                .getTracks()
                .forEach(
                    track =>
                        peerConnection
                            .addTrack(
                                track,
                                localStream
                            )
                );


            peerConnection.ontrack =
                event => {

                    const video =
                        document
                            .getElementById(
                                "remote-video"
                            );

                    video.classList
                        .remove(
                            "hidden"
                        );

                    video.srcObject =
                        event.streams[0];

                };


            peerConnection.onicecandidate =
                event => {

                    if (
                        event.candidate
                    ) {

                        socket.emit(
                            "ice_candidate",
                            {

                                to:
                                    data.from,

                                candidate:
                                    event.candidate

                            }
                        );

                    }

                };


            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.offer
                    )
                );


            const answer =
                await peerConnection
                    .createAnswer();


            await peerConnection
                .setLocalDescription(
                    answer
                );


            socket.emit(
                "make_answer",
                {

                    to:
                        data.from,

                    answer:
                        answer

                }
            );


        } catch (e) {

            alert(
                "تعذر بدء المكالمة."
            );

        }

    }
);


socket.on(
    "call_answered",
    async data => {

        if (!peerConnection)
            return;


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


        document
            .getElementById(
                "call-status"
            )
            .innerText =
            "المكالمة جارية";

    }
);


socket.on(
    "ice_candidate",
    async data => {

        if (!peerConnection)
            return;


        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        data.candidate
                    )
                );

        } catch (e) {}

    }
);


/* ================================================
MIC
================================================ */

function toggleMic() {

    if (!localStream)
        return;


    muted =
        !muted;


    localStream
        .getAudioTracks()
        .forEach(
            track =>
                track.enabled =
                !muted
        );

}


/* ================================================
CAMERA
================================================ */

function toggleCamera() {

    if (!localStream)
        return;


    cameraOn =
        !cameraOn;


    localStream
        .getVideoTracks()
        .forEach(
            track =>
                track.enabled =
                cameraOn
        );

}


/* ================================================
END CALL
================================================ */

function endCall() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    if (peerConnection) {

        peerConnection.close();

        peerConnection =
            null;

    }


    document
        .getElementById(
            "call-modal"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "local-video"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "remote-video"
        )
        .classList.add(
            "hidden"
        );

}


/* ================================================
ESCAPE
================================================ */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}
