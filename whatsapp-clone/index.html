<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let myUsername = "";
let currentChat = "الدردشة العامة";

let allMessages = [];
let usersData = {};
let groupsList = [];

let typingTimeout;

let peerConnection = null;
let localStream = null;
let remoteStream = null;
let incomingCallData = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

let isMuted = false;
let cameraEnabled = true;


/* ================= WEBRTC ================= */

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.relay.metered.ca:80"
        },

        {
            urls: "turn:global.relay.metered.ca:80",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        },

        {
            urls: "turn:global.relay.metered.ca:443",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        }

    ]

};


/* ================= LOGIN ================= */

function login() {

    const input =
        document.getElementById("username-input")
        .value.trim();

    if (!input) {

        alert("يرجى كتابة اسمك");

        return;
    }

    socket.emit("verify_user", input);
}


socket.on("auth_success", username => {

    myUsername = username;

    document
        .getElementById("login-screen")
        .classList.add("hidden");

    document
        .getElementById("app-screen")
        .classList.remove("hidden");

    document
        .getElementById("my-username-display")
        .innerText = username;

    switchChat("الدردشة العامة");

});


/* ================= USERS ================= */

socket.on("update_users", data => {

    usersData = data;

    renderChatsList();

});


socket.on("update_groups", groups => {

    groupsList = groups;

    renderChatsList();

});


function renderChatsList(filter = "") {

    const list =
        document.getElementById("chats-list");

    list.innerHTML = "";


    groupsList.forEach(group => {

        if (!group.includes(filter)) return;

        list.innerHTML += `

        <div
            onclick="switchChat(${JSON.stringify(group)})"
            class="p-4 hover:bg-gray-100 cursor-pointer
                   flex items-center gap-3">

            <div class="w-10 h-10 rounded-full
                        bg-[#00a884] text-white
                        flex items-center justify-center">

                <i class="fa-solid fa-users"></i>

            </div>

            <div>

                <div class="font-bold">
                    ${group}
                </div>

                <div class="text-xs text-gray-500">
                    مجموعة
                </div>

            </div>

        </div>`;

    });


    for (const username in usersData) {

        if (username === myUsername) continue;

        if (!username.includes(filter)) continue;

        list.innerHTML += `

        <div
            onclick="switchChat(${JSON.stringify(username)})"
            class="p-4 hover:bg-gray-100 cursor-pointer
                   flex items-center gap-3">

            <div class="w-10 h-10 rounded-full
                        bg-gray-400 text-white
                        flex items-center justify-center">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="flex-1">

                <div class="font-bold">
                    ${username}
                </div>

                <div class="text-xs text-green-600">
                    ${usersData[username].status}
                </div>

            </div>

        </div>`;

    }

}


function filterChats() {

    const value =
        document.getElementById("search-input")
        .value.trim();

    renderChatsList(value);

}


/* ================= CHAT ================= */

function switchChat(chatName) {

    currentChat = chatName;

    document
        .getElementById("current-chat-title")
        .innerText = chatName;

    document
        .getElementById("current-chat-status")
        .innerText =
        usersData[chatName]
        ? usersData[chatName].status
        : "مجموعة عامة";

    renderMessages();

    renderChatsList();

}


function createGroup() {

    const name =
        prompt("اكتب اسم المجموعة:");

    if (name) {

        socket.emit("create_group", name);

    }

}


/* ================= MESSAGES ================= */

function sendMessage() {

    const input =
        document.getElementById("message-input");

    const text = input.value.trim();

    if (!text) return;

    socket.emit("send_message", {

        chat: currentChat,

        username: myUsername,

        type: "text",

        text: text,

        time: new Date()
            .toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            })

    });

    input.value = "";

}


function sendImage(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        socket.emit("send_message", {

            chat: currentChat,

            username: myUsername,

            type: "image",

            content: reader.result,

            time: new Date()
                .toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                })

        });

    };

    reader.readAsDataURL(file);

}


function sendFile(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        socket.emit("send_message", {

            chat: currentChat,

            username: myUsername,

            type: "file",

            content: reader.result,

            fileName: file.name,

            time: new Date()
                .toLocaleTimeString([], {
                    hour: "2-digit",
                    minute: "2-digit"
                })

        });

    };

    reader.readAsDataURL(file);

}


/* ================= VOICE ================= */

async function toggleVoiceRecording() {

    const button =
        document.getElementById("mic-btn");

    if (!isRecording) {

        try {

            const stream =
                await navigator.mediaDevices
                .getUserMedia({audio:true});

            mediaRecorder =
                new MediaRecorder(stream);

            audioChunks = [];

            mediaRecorder.ondataavailable =
                e => audioChunks.push(e.data);

            mediaRecorder.onstop = () => {

                const blob =
                    new Blob(audioChunks,
                    {type:"audio/webm"});

                const reader =
                    new FileReader();

                reader.onload = () => {

                    socket.emit("send_message", {

                        chat: currentChat,

                        username: myUsername,

                        type: "audio",

                        content: reader.result,

                        time: new Date()
                            .toLocaleTimeString([], {
                                hour:"2-digit",
                                minute:"2-digit"
                            })

                    });

                };

                reader.readAsDataURL(blob);

                stream.getTracks()
                    .forEach(track => track.stop());

            };

            mediaRecorder.start();

            isRecording = true;

            button.classList.add("text-red-600");

        } catch (error) {

            alert("تعذر الوصول إلى المايكروفون");

        }

    } else {

        mediaRecorder.stop();

        isRecording = false;

        button.classList.remove("text-red-600");

    }

}


function handleKeyPress(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


function notifyTyping() {

    socket.emit("typing", {

        chat: currentChat,

        username: myUsername

    });

}


socket.on("display_typing", data => {

    if (
        data.chat === currentChat &&
        data.username !== myUsername
    ) {

        const indicator =
            document.getElementById("typing-indicator");

        indicator.innerText =
            data.username + " يكتب الآن...";

        indicator.classList.remove("hidden");

        clearTimeout(typingTimeout);

        typingTimeout =
            setTimeout(() => {

                indicator.classList.add("hidden");

            }, 2000);

    }

});


/* ================= MESSAGE HISTORY ================= */

socket.on("load_history", messages => {

    allMessages = messages;

    renderMessages();

});


socket.on("receive_message", message => {

    allMessages.push(message);

    renderMessages();

});


function renderMessages() {

    const container =
        document.getElementById("messages-container");

    container.innerHTML = "";

    allMessages
        .filter(message =>
            message.chat === currentChat)
        .forEach(message => {

            const isMe =
                message.username === myUsername;

            let content = "";

            if (message.type === "image") {

                content = `
                <img
                    src="${message.content}"
                    class="max-w-[250px] rounded-lg cursor-pointer"
                    onclick="window.open(this.src)">
                `;

            } else if (message.type === "audio") {

                content = `
                <audio controls class="w-56">
                    <source src="${message.content}">
                </audio>
                `;

            } else if (message.type === "file") {

                content = `
                <a
                    href="${message.content}"
                    download="${message.fileName || "file"}"
                    class="text-blue-600 underline">

                    <i class="fa-solid fa-file ml-1"></i>
                    ${message.fileName || "ملف"}

                </a>
                `;

            } else {

                content = `
                <div class="message-bubble text-sm">
                    ${escapeHtml(message.text || "")}
                </div>
                `;

            }

            container.innerHTML += `

            <div class="flex ${
                isMe
                ? "justify-end"
                : "justify-start"
            }">

                <div class="max-w-[75%]
                            px-4 py-2 rounded-xl shadow
                            ${
                                isMe
                                ? "bg-[#dcf8c6]"
                                : "bg-white"
                            }">

                    ${
                        !isMe
                        ? `
                        <div class="text-xs font-bold
                                    text-[#00a884] mb-1">

                            ${escapeHtml(message.username)}

                        </div>
                        `
                        : ""
                    }

                    ${content}

                    <div class="text-[10px] text-gray-500
                                text-left mt-1">

                        ${message.time || ""}

                    </div>

                </div>

            </div>`;

        });

    container.scrollTop =
        container.scrollHeight;

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ================= CALLS ================= */

function setupPeerConnectionEvents(pc) {

    pc.ontrack = event => {

        remoteStream =
            event.streams[0];

        if (
            remoteStream.getVideoTracks()
            .length > 0
        ) {

            const video =
                document.getElementById("remoteVideo");

            video.classList.remove("hidden");

            video.srcObject =
                remoteStream;

        } else {

            const audio =
                document.getElementById("remoteAudio");

            audio.srcObject =
                remoteStream;

            audio.play().catch(() => {});

        }

    };

}


async function startCall(type) {

    if (!currentChat ||
        currentChat === "الدردشة العامة" ||
        groupsList.includes(currentChat)) {

        alert("المكالمات الفردية متاحة مع المستخدمين فقط.");

        return;
    }

    try {

        document
            .getElementById("call-modal")
            .classList.remove("hidden");

        document
            .getElementById("call-status-text")
            .innerText =
            "جاري الاتصال بـ " + currentChat;

        localStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true,
                video:type === "video"
            });

        if (type === "video") {

            const video =
                document.getElementById("localVideo");

            video.classList.remove("hidden");

            video.srcObject =
                localStream;

        }

        peerConnection =
            new RTCPeerConnection(rtcConfig);

        localStream
            .getTracks()
            .forEach(track =>
                peerConnection
                .addTrack(track, localStream));

        setupPeerConnectionEvents(
            peerConnection
        );

        peerConnection.onicecandidate =
            event => {

                if (event.candidate) {

                    socket.emit("ice_candidate", {

                        to: currentChat,

                        candidate:
                            event.candidate

                    });

                }

            };

        const offer =
            await peerConnection.createOffer();

        await peerConnection
            .setLocalDescription(offer);

        socket.emit("call_user", {

            to: currentChat,

            from: myUsername,

            offer: offer,

            type: type

        });

    } catch (error) {

        console.error(error);

        alert(
            "تعذر تشغيل المكالمة. تأكد من السماح للمايك والكاميرا."
        );

        endCall();

    }

}


/* ================= INCOMING CALL ================= */

socket.on("incoming_call", data => {

    incomingCallData = data;

    document
        .getElementById("call-modal")
        .classList.remove("hidden");

    document
        .getElementById("call-status-text")

        "مكالمة واردة من " + data.from;

    document

        .innerHTML = `

        <div class="flex justify-center gap-4">

            <button
                onclick="acceptCall()"
                class="bg-green-600 text-white
                       px-6 py-3 rounded-xl font-bold">

                قبول

            <button

            </button>

    `;

});


async function acceptCall() {

    const data =
        incomingCallData;

    if (!data) return;

    currentChat =
        data.from;

    document
        .getElementById("call-status-text")
        .innerText =
        "جاري الاتصال مع " + data.from;

    document
        .getElementById("call-actions")
        .innerHTML = `

        <button
            onclick="endCall()"
            class="bg-red-600 text-white
                   px-8 py-3 rounded-xl font-bold">

            إنهاء المكالمة

        </button>
    `;


    try {

        localStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true,
                video:data.type === "video"
            });

        if (data.type === "video") {

            const video =
                document.getElementById("localVideo");

            video.classList.remove("hidden");

            video.srcObject =
                localStream;

        }


        peerConnection =
            new RTCPeerConnection(rtcConfig);

        localStream
            .getTracks()
            .forEach(track =>
                peerConnection
                .addTrack(track, localStream));

        setupPeerConnectionEvents(
            peerConnection
        );


        peerConnection.onicecandidate =
            event => {

                if (event.candidate) {

                    socket.emit("ice_candidate", {

                        to: data.from,

                        candidate:
                            event.candidate

                    });

                }

            };


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


        const answer =
            await peerConnection.createAnswer();

        await peerConnection
            .setLocalDescription(answer);


        socket.emit("make_answer", {

            to: data.from,

            answer: answer,

            from: myUsername

        });

    } catch (error) {

        console.error(error);

        alert("تعذر قبول المكالمة.");

        endCall();

    }

}


function rejectCall() {

    endCall();

}


socket.on("call_answered", async data => {

    if (!peerConnection) return;

    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );

        document
            .getElementById("call-status-text")
            .innerText =
            "المكالمة جارية...";

    } catch (error) {

        console.error(error);

    }

});


socket.on("ice_candidate", async data => {

    if (!peerConnection ||
        !data.candidate) return;

    try {

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

    } catch (error) {

        console.error(error);

    }

});


/* ================= CALL CONTROLS ================= */

function toggleMute() {

    if (!localStream) return;

    const tracks =
        localStream.getAudioTracks();

    tracks.forEach(track => {

        track.enabled =
            !track.enabled;

        isMuted =
            !track.enabled;

    });

    document
        .getElementById("mute-icon")
        .className =
        isMuted
        ? "fa-solid fa-microphone-slash"
        : "fa-solid fa-microphone";

}


function toggleCamera() {

    if (!localStream) return;

    const tracks =
        localStream.getVideoTracks();

    if (!tracks.length) return;

    tracks.forEach(track => {

        track.enabled =
            !track.enabled;

        cameraEnabled =
            track.enabled;

    });

    document
        .getElementById("camera-icon")
        .className =
        cameraEnabled
        ? "fa-solid fa-video"
        : "fa-solid fa-video-slash";

}


function endCall() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track =>
                track.stop());

    }

    if (peerConnection) {

        peerConnection.close();

    }

    peerConnection = null;
    localStream = null;
    remoteStream = null;
    incomingCallData = null;

    document
        .getElementById("call-modal")
        .classList.add("hidden");

    document
        .getElementById("localVideo")
        .classList.add("hidden");

    document
        .getElementById("remoteVideo")
        .classList.add("hidden");

}


/* ================= DARK MODE ================= */

function toggleDarkMode() {

    document.documentElement
        .classList.toggle("dark");

}


/* ================= START ================= */

window.addEventListener("load", () => {

    document
        .getElementById("username-input")
        .focus();

});

</script>

</body>
</html>
