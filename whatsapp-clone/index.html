<script src="/socket.io/socket.io.js"></script>

<script>

// =====================================================
// VARIABLES
// =====================================================

const socket = io();

let myUsername = "";

let currentChat = "الدردشة العامة";

let allMessages = [];

let usersData = {};

let groupsList = [];

let typingTimeout = null;

let unreadCounts = {};

let editingMessageId = null;

let contextMessageId = null;


// CALL

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let incomingCallData = null;

let currentCallType = null;

let callStartTime = null;

let callTimerInterval = null;

let micMuted = false;

let cameraDisabled = false;


// VOICE

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


// =====================================================
// RTC
// =====================================================

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.relay.metered.ca:80"
        },

        {
            urls: "turn:global.relay.metered.ca:80",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        },

        {
            urls: "turn:global.relay.metered.ca:80?transport=tcp",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        },

        {
            urls: "turn:global.relay.metered.ca:443",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        },

        {
            urls: "turn:global.relay.metered.ca:443?transport=tcp",
            username: "5a7f0ee6288a27c37fc25fa6",
            credential: "xHtDb/xICUr5qHKb"
        }

    ]

};


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (
            localStorage.getItem(
                "darkMode"
            ) === "true"
        ) {

            document.body.classList.add(
                "dark"
            );

            updateDarkIcon();
        }


        document.addEventListener(
            "click",
            event => {

                const menu =
                    document.getElementById(
                        "message-context-menu"
                    );

                if (
                    !menu.contains(
                        event.target
                    ) &&
                    !event.target.closest(
                        ".message-more"
                    )
                ) {

                    menu.classList.add(
                        "hidden"
                    );
                }
            }
        );

    }
);


// =====================================================
// DARK MODE
// =====================================================

function toggleDarkMode() {

    const enabled =
        document.body.classList.toggle(
            "dark"
        );

    localStorage.setItem(
        "darkMode",
        enabled
    );

    updateDarkIcon();
}


function updateDarkIcon() {

    const icon =
        document.getElementById(
            "dark-icon"
        );

    if (!icon) return;

    icon.className =
        document.body.classList.contains(
            "dark"
        )
            ? "fa-solid fa-sun text-xl"
            : "fa-solid fa-moon text-xl";
}


// =====================================================
// LOGIN
// =====================================================

function login() {

    const input =
        document.getElementById(
            "username-input"
        );

    const username =
        input.value.trim();

    if (!username) {

        showLoginError(
            "اكتب اسم المستخدم أولاً"
        );

        return;
    }

    if (username.length < 2) {

        showLoginError(
            "اسم المستخدم قصير جداً"
        );

        return;
    }


    if (
        "Notification" in window &&
        Notification.permission ===
            "default"
    ) {

        Notification.requestPermission()
            .catch(() => {});
    }


    socket.emit(
        "verify_user",
        username
    );
}


function showLoginError(
    text
) {

    const error =
        document.getElementById(
            "login-error"
        );

    error.innerText =
        text;

    error.classList.remove(
        "hidden"
    );
}


// =====================================================
// AUTH
// =====================================================

socket.on(
    "auth_success",
    username => {

        myUsername =
            username;

        document
            .getElementById(
                "login-screen"
            )
            .classList.add(
                "hidden"
            );

        document
            .getElementById(
                "app-screen"
            )
            .classList.remove(
                "hidden"
            );

        document
            .getElementById(
                "my-username-display"
            )
            .innerText =
            username;

        updateMyAvatar();

        switchChat(
            "الدردشة العامة"
        );

    }
);


socket.on(
    "auth_error",
    message => {

        showLoginError(
            message
        );
    }
);


// =====================================================
// USERS
// =====================================================

socket.on(
    "update_users",
    data => {

        usersData =
            data || {};

        renderChatsList();

        updateOnlineCount();

        updateCurrentStatus();
    }
);


socket.on(
    "update_groups",
    groups => {

        groupsList =
            groups || [];

        renderChatsList();
    }
);


function updateOnlineCount() {

    let count = 0;

    Object.keys(
        usersData
    ).forEach(
        username => {

            if (
                username !== myUsername &&
                usersData[username] &&
                usersData[username].status ===
                    "متصل"
            ) {

                count++;
            }
        }
    );


    document
        .getElementById(
            "online-count"
        )
        .innerText =
        count + " متصل";
}


// =====================================================
// CHAT LIST
// =====================================================

function renderChatsList(
    filter = ""
) {

    const list =
        document.getElementById(
            "chats-list"
        );

    list.innerHTML = "";

    const query =
        filter.toLowerCase();


    // GROUPS

    groupsList.forEach(
        group => {

            if (
                !group
                    .toLowerCase()
                    .includes(query)
            ) {
                return;
            }


            const selected =
                currentChat === group;


            list.innerHTML += `

                <div
                    onclick='switchChat(${JSON.stringify(group)})'
                    class="chat-item ${
                        selected
                            ? "chat-selected"
                            : ""
                    } p-3 cursor-pointer flex items-center gap-3"
                >

                    <div
                        class="w-12 h-12 rounded-full bg-[#00a884] text-white flex items-center justify-center shrink-0"
                    >
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <div class="min-w-0 flex-1">

                        <div class="flex justify-between">

                            <span class="font-bold dark-text truncate">
                                ${escapeHtml(group)}
                            </span>

                            ${
                                unreadCounts[group]
                                    ? `
                                        <span class="unread-badge bg-[#25d366] text-white rounded-full flex items-center justify-center text-xs font-bold">
                                            ${unreadCounts[group]}
                                        </span>
                                    `
                                    : ""
                            }

                        </div>

                        <div class="text-xs text-gray-500 dark-muted">
                            مجموعة
                        </div>

                    </div>

                </div>
            `;
        }
    );


    // USERS

    Object.keys(
        usersData
    ).forEach(
        username => {

            if (
                username ===
                myUsername
            ) {
                return;
            }


            if (
                !username
                    .toLowerCase()
                    .includes(query)
            ) {
                return;
            }


            const user =
                usersData[username];

            const selected =
                currentChat ===
                username;


            const statusText =
                user.status ===
                "متصل"
                    ? "متصل الآن"
                    : formatLastSeen(
                        user.lastSeen
                    );


            list.innerHTML += `

                <div
                    onclick='switchChat(${JSON.stringify(username)})'
                    class="chat-item ${
                        selected
                            ? "chat-selected"
                            : ""
                    } p-3 cursor-pointer flex items-center gap-3"
                >

                    <div
                        class="w-12 h-12 rounded-full bg-gray-400 text-white flex items-center justify-center shrink-0"
                    >
                        <i class="fa-solid fa-user"></i>
                    </div>

function updateCurrentStatus() {

    const status =
        document.getElementById(
            "current-chat-status"
        );


    // المجموعة

    if (
        groupsList.includes(
            currentChat
        )
    ) {

    }


    // المستخدم

    const user =
        usersData[currentChat];


    if (!user) {

    if (
        user.status ===
        "متصل"
    ) {

            formatLastSeen(
                user.lastSeen
            );

function formatLastSeen(
    timestamp
) {

    if (!timestamp)
        return "غير متصل";

    const date =
        new Date(
            timestamp
        );

    return (
        "آخر ظهور " +
        date.toLocaleString(
            "ar-IQ",
            {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            }
        )
    );
}

// =====================================================
// SEND MESSAGE
// =====================================================

function sendMessage() {

    const input =
        document.getElementById(
            "message-input"
        );

    const text =
        input.value.trim();


    if (!text)
        return;


    if (
        editingMessageId
    ) {

        socket.emit(
            "edit_message",
            {
                id:
                    editingMessageId,

                text:
                    text
            }
        );

        cancelEdit();

        return;
    }


    socket.emit(
        "send_message",
        {

            chat:
                currentChat,

            type:
                "text",

            text:
                text,

            time:
                new Date()
                    .toLocaleTimeString(
                        "ar-IQ",
                        {
                            hour:
                                "2-digit",

                            minute:
                                "2-digit"
                        }
                    )
        }
    );


    input.value =
        "";
}


// =====================================================
// IMAGE
// =====================================================

function sendImage(
    event
) {

    const file =
        event.target.files[0];

    if (!file)
        return;


    if (
        file.size >
        15 * 1024 * 1024
    ) {

        alert(
            "الصورة أكبر من 15MB"
        );

        event.target.value =
            "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        () => {

            socket.emit(
                "send_message",
                {

                    chat:
                        currentChat,

                    type:
                        "image",

                    content:
                        reader.result,

                    text:
                        "",

                    time:
                        new Date()
                            .toLocaleTimeString(
                                "ar-IQ",
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            )
                }
            );
        };


    reader.readAsDataURL(
        file
    );

    event.target.value =
        "";
}


// =====================================================
// FILE
// =====================================================

function sendFile(
    event
) {

    const file =
        event.target.files[0];

    if (!file)
        return;


    if (
        file.size >
        20 * 1024 * 1024
    ) {

        alert(
            "الملف أكبر من 20MB"
        );

        event.target.value =
            "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        () => {

            socket.emit(
                "send_message",
                {

                    chat:
                        currentChat,

                    type:
                        getFileType(
                            file
                        ),

                    content:
                        reader.result,

                    text:
                        file.name,

                    fileName:
                        file.name,

                    fileSize:
                        file.size,

                    mimeType:
                        file.type,

                    time:
                        new Date()
                            .toLocaleTimeString(
                                "ar-IQ",
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            )
                }
            );
        };


    reader.readAsDataURL(
        file
    );

    event.target.value =
        "";
}


function getFileType(
    file
) {

    if (
        file.type.startsWith(
            "video/"
        )
    ) {

        return "video";
    }

    return "file";
}


// =====================================================
// VOICE
// =====================================================

async function toggleVoiceRecording() {

    const button =
        document.getElementById(
            "mic-btn"
        );


    if (!isRecording) {

        try {

            const stream =
                await navigator
                    .mediaDevices
                    .getUserMedia(
                        {
                            audio:
                                true
                        }
                    );


            mediaRecorder =
                new MediaRecorder(
                    stream
                );


            audioChunks =
                [];


            mediaRecorder.ondataavailable =
                event => {

                    if (
                        event.data.size >
                        0
                    ) {

                        audioChunks.push(
                            event.data
                        );
                    }
                };


            mediaRecorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    "audio/webm"
                            }
                        );


                    const reader =
                        new FileReader();


                    reader.onload =
                        () => {

                            socket.emit(
                                "send_message",
                                {

                                    chat:
                                        currentChat,

                                    type:
                                        "audio",

                                    content:
                                        reader.result,

                                    time:
                                        new Date()
                                            .toLocaleTimeString(
                                                "ar-IQ",
                                                {
                                                    hour:
                                                        "2-digit",

                                                    minute:
                                                        "2-digit"
                                                }
                                            )
                                }
                            );
                        };


                    reader.readAsDataURL(
                        blob
                    );


                    stream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );
                };


            mediaRecorder.start();

            isRecording =
                true;


            button.classList.add(
                "text-red-500",
                "recording"
            );

        } catch(error) {

            alert(
                "تعذر الوصول إلى المايكروفون."
            );
        }

    } else {

        mediaRecorder.stop();

        isRecording =
            false;

        button.classList.remove(
            "text-red-500",
            "recording"
        );
    }
}

// =====================================================
// RENDER MESSAGES
// =====================================================

function renderMessages() {

    const container =
        document.getElementById(
            "messages-container"
        );


    const messages =
        allMessages.filter(
            message =>
                message.chat ===
                currentChat
        );


    container.innerHTML =
        "";


    if (
        !messages.length
    ) {

        container.innerHTML = `

            <div
                class="h-full flex items-center justify-center"
            >

                <div
                    class="bg-white/80 rounded-xl px-5 py-3 text-sm text-gray-500 shadow"
                >
                    لا توجد رسائل بعد
                </div>

            </div>

        `;

        return;
    }


    messages.forEach(
        message => {

            const isMe =
                message.username ===
                myUsername;


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                `flex ${
                    isMe
                        ? "justify-end"
                        : "justify-start"
                }`;


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                `relative max-w-[85%] md:max-w-[65%] px-3 py-2 rounded-xl shadow ${
                    isMe
                        ? "outgoing-message bg-[#dcf8c6]"
                        : "incoming-message bg-white"
                }`;


            if (!isMe) {

                const sender =
                    document.createElement(
                        "div"
                    );


                sender.className =
                    "text-xs font-bold text-[#00a884] mb-1";


                sender.innerText =
                    message.username;


                bubble.appendChild(
                    sender
                );
            }


            if (
                message.deleted
            ) {

                const deleted =
                    document.createElement(
                        "div"
                    );


                deleted.className =
                    "text-sm italic text-gray-500";


                deleted.innerText =
                    "تم حذف هذه الرسالة";


                bubble.appendChild(
                    deleted
                );

            } else {

                bubble.appendChild(
                    createMessageContent(
                        message
                    )
                );
            }


            const footer =
                document.createElement(
                    "div"
                );


            footer.className =
                "flex items-center justify-end gap-1 mt-1";


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "text-[10px] text-gray-500";


            time.innerText =
                message.time || "";


            footer.appendChild(
                time
            );


            if (
                message.edited
            ) {

                const edited =
                    document.createElement(
                        "span"
                    );


                edited.className =
                    "text-[9px] text-gray-400";


                edited.innerText =
                    "معدلة";


                footer.appendChild(
                    edited
                );
            }


            if (isMe) {

                const status =
                    document.createElement(
                        "span"
                    );


                status.innerHTML =
                    getMessageStatusIcon(
                        message.status
                    );


                footer.appendChild(
                    status
                );
            }


            bubble.appendChild(
                footer
            );


            const more =
                document.createElement(
                    "button"
                );


            more.className =
                "message-more absolute left-1 top-1 text-gray-400 hover:text-gray-700";


            more.innerHTML =
                '<i class="fa-solid fa-ellipsis-vertical"></i>';


            more.onclick =
                event => {

                    event.stopPropagation();

                    openMessageMenu(
                        event,
                        message
                    );
                };


            bubble.appendChild(
                more
            );


            wrapper.appendChild(
                bubble
            );


            container.appendChild(
                wrapper
            );


            if (
                !isMe &&
                message.id
            ) {

                socket.emit(
                    "mark_read",
                    {
                        messageId:
                            message.id
                    }
                );
            }

        }
    );


    container.scrollTop =
        container.scrollHeight;
}


// =====================================================
// CONTENT
// =====================================================

function createMessageContent(
    message
) {

    const box =
        document.createElement(
            "div"
        );


    // TEXT

    if (
        message.type ===
        "text"
    ) {

        const text =
            document.createElement(
                "div"
            );


        text.className =
            "text-sm whitespace-pre-wrap break-words dark-text";


        text.innerText =
            message.text || "";


        box.appendChild(
            text
        );


        return box;
    }


    // IMAGE

    if (
        message.type ===
        "image"
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            message.content;


        image.className =
            "max-w-full md:max-w-[350px] max-h-[400px] rounded-lg cursor-pointer";


        image.onclick =
            () => {

                window.open(
                    image.src,
                    "_blank"
                );
            };


        box.appendChild(
            image
        );


        return box;
    }


    // AUDIO

    if (
        message.type ===
        "audio"
    ) {

        const audio =
            document.createElement(
                "audio"
            );


        audio.controls =
            true;


        audio.src =
            message.content;


        audio.className =
            "max-w-[280px]";


        box.appendChild(
            audio
        );


        return box;
    }


    // VIDEO

    if (
        message.type ===
        "video"
    ) {

        const video =
            document.createElement(
                "video"
            );


        video.controls =
            true;


        video.src =
            message.content;


        video.className =
            "max-w-full md:max-w-[400px] rounded-lg";


        box.appendChild(
            video
        );


        return box;
    }


    // FILE

    if (
        message.type ===
        "file"
    ) {

        const link =
            document.createElement(
                "a"
            );


        link.href =
            message.content;


        link.download =
            message.fileName ||
            "file";


        link.target =
            "_blank";


        link.className =
            "flex items-center gap-3 bg-black/5 rounded-lg p-3";


        const icon =
            document.createElement(
                "i"
            );


        icon.className =
            "fa-solid fa-file text-2xl text-[#00a884]";


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "text-sm break-all";


        name.innerText =
            message.fileName ||
            message.text ||
            "ملف";


        link.appendChild(
            icon
        );

        link.appendChild(
            name
        );


        box.appendChild(
            link
        );


        return box;
    }


    return box;
}


// =====================================================
// STATUS ICON
// =====================================================

function getMessageStatusIcon(
    status
) {

    if (
        status ===
        "read"
    ) {

        return `
            <span class="text-blue-500">
                <i class="fa-solid fa-check-double"></i>
            </span>
        `;
    }


    if (
        status ===
        "delivered"
    ) {

        return `
            <span class="text-gray-500">

            </span>
        `;
    }


    return `
        <span class="text-gray-500">
            <i class="fa-solid fa-check"></i>
        </span>
    `;
}

// =====================================================

function openMessageMenu(
    event,
    message
) {

    contextMessageId =
        message.id;


    const menu =
        document.getElementById(
            "message-context-menu"
        );


    const editButton =
        document.getElementById(
            "context-edit"
        );


    editButton.style.display =
        message.username ===
            myUsername &&
        message.type ===
            "text" &&
        !message.deleted
            ? "block"
            : "none";


    menu.style.left =
        Math.min(
            event.clientX,
            window.innerWidth -
                180
        ) + "px";


    menu.style.top =
        Math.min(
            event.clientY,
            window.innerHeight -
                160
        ) + "px";


    menu.classList.remove(
        "hidden"
    );
}


function getContextMessage() {

    return allMessages.find(
        message =>
            message.id ===
            contextMessageId
    );
}


async function contextCopy() {

    const message =
        getContextMessage();

    if (!message)
        return;


    try {

        await navigator
            .clipboard
            .writeText(
                message.text || ""
            );

        showToast(
            "تم النسخ"
        );

    } catch(e) {}


    closeContextMenu();
}


function contextEdit() {

    const message =
        getContextMessage();


    if (!message)
        return;


    if (
        message.username !==
            myUsername ||
        message.type !==
            "text"
    ) {

        return;
    }


    editingMessageId =
        message.id;


    document
        .getElementById(
            "message-input"
        )
        .value =
        message.text;


    document
        .getElementById(
            "edit-preview"
        )
        .innerText =
        message.text;


    document
        .getElementById(
            "edit-bar"
        )
        .classList.remove(
            "hidden"
        );


    document
        .getElementById(
            "message-input"
        )
        .focus();


    closeContextMenu();
}


function cancelEdit() {

    editingMessageId =
        null;


    document
        .getElementById(
            "message-input"
        )
        .value =
        "";


    document
        .getElementById(
            "edit-bar"
        )
        .classList.add(
            "hidden"
        );
}


function contextDelete() {

    const message =
        getContextMessage();


    if (!message)
        return;


    if (
        message.username !==
        myUsername
    ) {

        closeContextMenu();

        return;
    }


    if (
        confirm(
            "هل تريد حذف هذه الرسالة؟"
        )
    ) {

        socket.emit(
            "delete_message",
            {
                id:
                    message.id
            }
        );
    }


    closeContextMenu();
}


function closeContextMenu() {

    document
        .getElementById(
            "message-context-menu"
        )
        .classList.add(

        );
}

                "chat-search-input"

            .value
            .trim()
            .toLowerCase();


    if (!query) {

        renderMessages();

        return;
    }


    const container =
        document.getElementById(
            "messages-container"
        );


    container.innerHTML =
        "";


    allMessages
        .filter(
            message =>
                message.chat ===
                    currentChat &&
                !message.deleted &&
                (
                    message.text ||
                    ""
                )
                    .toLowerCase()
                    .includes(
                        query
                    )
        )
        .forEach(
            message => {

                const result =
                    document.createElement(
                        "div"
                    );


                result.className =
                    "bg-white rounded-lg p-3 shadow mb-2";


                const sender =
                    document.createElement(
                        "div"
                    );


                sender.className =
                    "text-xs text-gray-400";


                sender.innerText =
                    message.username +
                    " • " +
                    (
                        message.time ||
                        ""
                    );


                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "mt-1";


                text.innerText =
                    message.text ||
                    "";


                result.appendChild(
                    sender
                );

                result.appendChild(
                    text
                );


                container.appendChild(
                    result
                );
            }
        );
}

function showNotification(
    message
) {

    if (
        !("Notification" in window)
    )
        return;


    if (
        Notification.permission !==
        "granted"
    )
        return;


    let body =
        "رسالة جديدة";


    if (
        message.type ===
        "text"
    ) {

        body =
            message.text;
    }

    else if (
        message.type ===
        "image"
    ) {

        body =
            "أرسل صورة";
    }

    else if (
        message.type ===
        "audio"
    ) {

        body =
            "أرسل رسالة صوتية";
    }

    else if (
        message.type ===
        "video"
    ) {

        body =
            "أرسل فيديو";
    }

    else if (
        message.type ===
        "file"
    ) {

        body =
            "أرسل ملف";
    }


    try {

        new Notification(
            "رسالة من " +
            message.username,
            {
                body:
                    body
            }
        );

    } catch(e) {}
}


// =====================================================
// SOUND
// =====================================================

function playSound(
    type
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext)
            return;


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        if (
            type ===
            "message"
        ) {

            oscillator.frequency.value =
                800;

            gain.gain.value =
                0.08;


            oscillator.start();


            oscillator.stop(
                ctx.currentTime +
                0.1
            );
        }


        if (
            type ===
            "ring"
        ) {

            oscillator.frequency.value =
                440;

            gain.gain.value =
                0.15;


            oscillator.start();


            oscillator.stop(
                ctx.currentTime +
                0.4
            );
        }

    } catch(e) {}
}


// =====================================================
// WEBRTC
// =====================================================

function setupPeerConnectionEvents(
    pc
) {

    pc.ontrack =
        event => {

            remoteStream =
                event.streams[0];


            const remoteVideo =
                document.getElementById(
                    "remoteVideo"
                );


            const remoteAudio =
                document.getElementById(
                    "remoteAudio"
                );


            if (
                remoteStream
                    .getVideoTracks()
                    .length > 0
            ) {

                remoteVideo
                    .classList
                    .remove(
                        "hidden"
                    );


                remoteVideo.srcObject =
                    remoteStream;

            } else {

                remoteAudio.srcObject =
                    remoteStream;


                remoteAudio
                    .play()
                    .catch(
                        () => {}
                    );
            }
        };


    pc.onconnectionstatechange =
        () => {

            if (
                pc.connectionState ===
                "connected"
            ) {

                document
                    .getElementById(
                        "call-status-text"
                    )
                    .innerText =
                    "المكالمة جارية...";
            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                document
                    .getElementById(
                        "call-status-text"
                    )
                    .innerText =
                    "فشل الاتصال";
            }
        };
}


// =====================================================
// START CALL - FIXED
// =====================================================

async function startCall(
    type
) {

    /*
        الإصلاح المهم هنا:

        ما نعتمد على groupsList لمعرفة
        إذا كانت المحادثة مجموعة.

        نعتمد على usersData مباشرة.

        إذا كان currentChat موجود داخل usersData
        فهذا يعني أنه مستخدم.
    */

    const targetUser =
        usersData[
            currentChat
        ];


    // ليس مستخدم

    if (!targetUser) {

        alert(
            "المكالمات الفردية متاحة للمستخدمين فقط."
        );

        return;
    }


    // المستخدم موجود لكن غير متصل

    if (
        targetUser.status !==
        "متصل"
    ) {

        alert(
            "هذا المستخدم غير متصل."
        );

        return;
    }


    try {

        currentCallType =
            type;


        document
            .getElementById(
                "call-modal"
            )
            .classList.remove(
                "hidden"
            );


        document
            .getElementById(
                "call-modal"
            )
            .classList.add(
                "flex"
            );


        document
            .getElementById(
                "call-status-text"
            )
            .innerText =
            "جاري الاتصال بـ " +
            currentChat;


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    {
                        audio:
                            true,

                        video:
                            type ===
                            "video"
                    }
                );


        if (
            type ===
            "video"
        ) {

            const localVideo =
                document.getElementById(
                    "localVideo"
                );


            localVideo
                .classList
                .remove(
                    "hidden"
                );


            localVideo.srcObject =
                localStream;
        }


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );
                }
            );


        setupPeerConnectionEvents(
            peerConnection
        );


        peerConnection.onicecandidate =
            event => {

                if (
                    !event.candidate
                )
                    return;


                socket.emit(
                    "ice_candidate",
                    {

                        to:
                            currentChat,

                        candidate:
                            event.candidate
                    }
                );


                if (
                    event.candidate.type ===
                    "relay"
                ) {

                    socket.emit(
                        "turn_connection_active",
                        {
                            to:
                                currentChat
                        }
                    );
                }
            };


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        socket.emit(
            "call_user",
            {

                to:
                    currentChat,

                from:
                    myUsername,

                offer:
                    offer,

                type:
                    type
            }
        );


        startCallTimer();

        renderCallControls();


    } catch(error) {

        console.error(
            "CALL ERROR:",
            error
        );


        alert(
            "تعذر تشغيل المايكروفون أو الكاميرا."
        );


        endCall();
    }
}

// =====================================================
// ACCEPT CALL
// =====================================================

async function acceptCall() {

    const data =
        incomingCallData;


    if (!data)
        return;


    try {

        currentChat =
            data.from;


        currentCallType =
            data.type;


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    {
                        audio:
                            true,

                        video:
                            data.type ===
                            "video"
                    }
                );


        if (
            data.type ===
            "video"
        ) {

            const localVideo =
                document.getElementById(
                    "localVideo"
                );


            localVideo
                .classList
                .remove(
                    "hidden"
                );


            localVideo.srcObject =
                localStream;
        }


        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );
                }
            );


        setupPeerConnectionEvents(
            peerConnection
        );


        peerConnection.onicecandidate =
            event => {

                if (
                    !event.candidate
                )
                    return;


                socket.emit(
                    "ice_candidate",
                    {

                        to:
                            data.from,

                        candidate:
                            event.candidate
                    }
                );
            };


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        socket.emit(
            "make_answer",
            {

                to:
                    data.from,

                answer:
                    answer,

                from:
                    myUsername
            }
        );


        document
            .getElementById(
                "call-status-text"
            )
            .innerText =
            "المكالمة جارية...";


        startCallTimer();

        renderCallControls();


        incomingCallData =
            null;


    } catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        alert(
            "تعذر قبول المكالمة."
        );


        endCall();
    }
}

function toggleCallMic() {

    if (!localStream)
        return;


    const tracks =
        localStream
            .getAudioTracks();


    if (!tracks.length)
        return;


    micMuted =
        !micMuted;


    tracks.forEach(
        track => {

            track.enabled =
                !micMuted;
        }
    );


    const button =
        document.getElementById(
            "call-mic-button"
        );


    if (button) {

        button.innerHTML =
            micMuted
                ? '<i class="fa-solid fa-microphone-slash"></i>'
                : '<i class="fa-solid fa-microphone"></i>';
    }
}


function toggleCallCamera() {

    if (!localStream)
        return;


    const tracks =
        localStream
            .getVideoTracks();


    if (!tracks.length)
        return;


    cameraDisabled =
        !cameraDisabled;


    tracks.forEach(
        track => {

            track.enabled =
                !cameraDisabled;
        }
    );


    const button =
        document.getElementById(
            "call-camera-button"
        );


    if (button) {

        button.innerHTML =
            cameraDisabled
                ? '<i class="fa-solid fa-video-slash"></i>'
                : '<i class="fa-solid fa-video"></i>';
    }
}


// =====================================================
// CALL TIMER
// =====================================================

function startCallTimer() {

    clearInterval(
        callTimerInterval
    );


    callStartTime =
        Date.now();


    callTimerInterval =
        setInterval(
            () => {

                const seconds =
                    Math.floor(
                        (
                            Date.now() -
                            callStartTime
                        ) / 1000
                    );


                const minutes =
                    Math.floor(
                        seconds / 60
                    );


                const secs =
                    seconds % 60;


                document
                    .getElementById(
                        "call-timer"
                    )
                    .innerText =
                    String(
                        minutes
                    ).padStart(
                        2,
                        "0"
                    ) +
                    ":" +
                    String(
                        secs
                    ).padStart(
                        2,
                        "0"
                    );

            },
            1000
        );
}

function rejectCall() {

    incomingCallData =
        null;

    endCall();
}


// =====================================================
// END CALL
// =====================================================

function endCall() {

    clearInterval(
        callTimerInterval
    );


    callTimerInterval =
        null;


    if (
        localStream
    ) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        localStream =
            null;
    }


    if (
        peerConnection
    ) {

        peerConnection.close();

        peerConnection =
            null;
    }


    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );


    const localVideo =
        document.getElementById(
            "localVideo"
        );


    const remoteAudio =
        document.getElementById(
            "remoteAudio"
        );


    remoteVideo.srcObject =
        null;


    localVideo.srcObject =
        null;


    remoteAudio.srcObject =
        null;


    remoteVideo.classList.add(
        "hidden"
    );


    localVideo.classList.add(
        "hidden"
    );


    document
        .getElementById(
            "call-modal"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "call-modal"
        )
        .classList.remove(
            "flex"
        );


    incomingCallData =
        null;


    micMuted =
        false;


    cameraDisabled =
        false;


    currentCallType =
        null;


    document
        .getElementById(
            "call-timer"
        )
        .innerText =
        "00:00";
}

// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";
    }


    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
